name: Jet Config Tester

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: jet-config-tester
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "requests[socks]"

      - name: Download Xray Core
        run: |
          mkdir -p bin
          curl -L --fail \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip \
            -o xray.zip
          unzip -o xray.zip -d bin
          chmod +x bin/xray
          bin/xray version

      - name: Test configurations
        run: python tester.py

      - name: Publish passing configurations
        if: success()
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
        run: python publish.py
